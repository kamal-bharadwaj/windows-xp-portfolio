<span class="font-button-text text-button-text text-white" id="clock">12:00 PM</span>
</div>

<script>
        // Clock functionality
        function updateClock() {
            const now = new Date();
            let hours = now.getHours();
            const minutes = String(now.getMinutes()).padStart(2, '0');
            const ampm = hours >= 12 ? 'PM' : 'AM';
            hours = hours % 12;
            hours = hours ? hours : 12;
            document.getElementById('clock').textContent = `${hours}:${minutes} ${ampm}`;
        }
        setInterval(updateClock, 1000);
        updateClock();

        // Simple button active state visual (skeuomorphic shift)
        document.querySelectorAll('.skeuo-raised').forEach(btn => {
            btn.addEventListener('mousedown', () => {
                btn.style.boxShadow = "inset 1px 1px 2px rgba(0,0,0,0.4)";
                btn.style.borderTop = "1px solid #808080";
                btn.style.borderLeft = "1px solid #808080";
                btn.style.borderRight = "1px solid #ffffff";
                btn.style.borderBottom = "1px solid #ffffff";
            });
            btn.addEventListener('mouseup', () => {
                btn.style.boxShadow = "inset 1px 1px 0 rgba(255,255,255,0.8), 1px 1px 0 rgba(0,0,0,0.2)";
                btn.style.borderTop = "1px solid #ffffff";
                btn.style.borderLeft = "1px solid #ffffff";
                btn.style.borderRight = "1px solid #808080";
                btn.style.borderBottom = "1px solid #808080";
            });
        });
    </script>
