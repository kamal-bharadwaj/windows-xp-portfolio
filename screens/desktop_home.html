<script>
        // System Clock Logic
        function updateClock() {
            const clockEl = document.getElementById('clock');
            const now = new Date();
            let hours = now.getHours();
            const minutes = now.getMinutes().toString().padStart(2, '0');
            const ampm = hours >= 12 ? 'PM' : 'AM';
            hours = hours % 12;
            hours = hours ? hours : 12; // the hour '0' should be '12'
            clockEl.textContent = `${hours}:${minutes} ${ampm}`;
        }
        setInterval(updateClock, 1000);
        updateClock();

        // Icon Selection Logic
        function toggleSelection(element) {
            // Deselect all
            document.querySelectorAll('.desktop-icon').forEach(icon => {
                icon.classList.remove('selected');
            });
            // Select clicked
            element.classList.add('selected');
        }

        // Click outside icons to deselect
        document.getElementById('desktop').addEventListener('click', (e) => {
            if (e.target.id === 'desktop' || e.target.id === 'icon-grid') {
                document.querySelectorAll('.desktop-icon').forEach(icon => {
                    icon.classList.remove('selected');
                });
            }
        });

        // Marquee Selection Effect (Simulated)
        const desktop = document.getElementById('desktop');
        const marquee = document.getElementById('marquee');
        let isSelecting = false;
        let startX, startY;

        desktop.addEventListener('mousedown', (e) => {
            if (e.target !== desktop && e.target.id !== 'icon-grid') return;
            isSelecting = true;
            startX = e.clientX;
            startY = e.clientY;
            marquee.style.left = startX + 'px';
            marquee.style.top = startY + 'px';
            marquee.style.width = '0px';
            marquee.style.height = '0px';
            marquee.classList.remove('hidden');
        });

        window.addEventListener('mousemove', (e) => {
            if (!isSelecting) return;
            let currentX = e.clientX;
            let currentY = e.clientY;

            let width = Math.abs(currentX - startX);
            let height = Math.abs(currentY - startY);
            let left = currentX < startX ? currentX : startX;
            let top = currentY < startY ? currentY : startY;

            marquee.style.width = width + 'px';
            marquee.style.height = height + 'px';
            marquee.style.left = left + 'px';
            marquee.style.top = top + 'px';
        });

        window.addEventListener('mouseup', () => {
            isSelecting = false;
            marquee.classList.add('hidden');
        });

        // Micro-interaction: Start Menu Tooltip/Feedback
        const startBtn = document.querySelector('.taskbar-start-btn');
        startBtn.addEventListener('click', () => {
            console.log('Start Menu Triggered');
            // This would normally open a popup menu
        });
    </script>
