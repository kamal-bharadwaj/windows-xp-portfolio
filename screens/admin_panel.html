<style>
        .win-bevel-raised {
            border-top: 2px solid #ffffff;
            border-left: 2px solid #ffffff;
            border-right: 2px solid #888888;
            border-bottom: 2px solid #888888;
        }
        .win-bevel-inset {
            border-top: 2px solid #888888;
            border-left: 2px solid #888888;
            border-right: 2px solid #ffffff;
            border-bottom: 2px solid #ffffff;
        }
        .win-groupbox {
            border: 1px solid #d0d0bf;
            border-radius: 4px;
        }
        .win-groupbox-label {
            color: #0046b8;
        }
        .taskbar-gradient {
            background: linear-gradient(to bottom, #245edb 0%, #0046b8 50%, #003ea6 100%);
        }
        .start-button-gradient {
            background: linear-gradient(to bottom, #4CAF50 0%, #2E7D32 100%);
        }
        .tab-active {
            background-color: #ece9d8;
            border-top: 1px solid #ffffff;
            border-left: 1px solid #ffffff;
            border-right: 1px solid #888888;
            border-bottom: none;
            z-index: 10;
            position: relative;
            margin-bottom: -1px;
            padding-bottom: 3px;
        }
        .tab-inactive {
            background-color: #f1eedd;
            border-top: 1px solid #ffffff;
            border-left: 1px solid #ffffff;
            border-right: 1px solid #888888;
            border-bottom: 1px solid #888888;
            margin-top: 2px;
        }
        .button-gradient {
            background: linear-gradient(to bottom, #f0f0ea 0%, #e0e0d5 100%);
        }
        .button-gradient:active {
            background: linear-gradient(to bottom, #d0d0c5 0%, #e0e0d5 100%);
        }
      </style>
