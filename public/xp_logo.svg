<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Classic Windows XP Logo: 4-color flag with a soft 3D wave and drop shadow -->
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="2" />
      <feOffset dx="1" dy="1" result="offsetblur" />
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.3" />
      </feComponentTransfer>
      <feMerge>
        <feMergeNode />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>
  <g filter="url(#shadow)">
    <!-- Top Left: Red -->
    <path d="M15 25 Q 32 18, 50 25 L 50 48 Q 32 41, 15 48 Z" fill="#eb3c24" />
    <!-- Top Right: Green -->
    <path d="M54 25 Q 72 32, 90 25 L 90 48 Q 72 55, 54 48 Z" fill="#3c813f" />
    <!-- Bottom Left: Blue -->
    <path d="M15 52 Q 32 45, 50 52 L 50 75 Q 32 68, 15 75 Z" fill="#245edb" />
    <!-- Bottom Right: Yellow -->
    <path d="M54 52 Q 72 59, 90 52 L 90 75 Q 72 82, 54 75 Z" fill="#ffb400" />
  </g>
</svg>