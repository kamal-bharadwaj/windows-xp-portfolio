<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <!-- Smooth 3D Drop Shadow -->
    <filter id="logoShadow" x="-20%" y="-20%" width="150%" height="150%">
      <feDropShadow dx="2" dy="3" stdDeviation="2.5" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
    
    <!-- Red Pane Gradients -->
    <linearGradient id="redBase" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ff7354"/>
      <stop offset="35%" stop-color="#e22a0a"/>
      <stop offset="85%" stop-color="#b61100"/>
      <stop offset="100%" stop-color="#800a00"/>
    </linearGradient>
    
    <!-- Green Pane Gradients -->
    <linearGradient id="greenBase" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#9ef451"/>
      <stop offset="35%" stop-color="#5ab01d"/>
      <stop offset="85%" stop-color="#2d6e07"/>
      <stop offset="100%" stop-color="#184200"/>
    </linearGradient>
    
    <!-- Blue Pane Gradients -->
    <linearGradient id="blueBase" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#5ac1ff"/>
      <stop offset="35%" stop-color="#1968e7"/>
      <stop offset="85%" stop-color="#00319e"/>
      <stop offset="100%" stop-color="#001859"/>
    </linearGradient>
    
    <!-- Yellow Pane Gradients -->
    <linearGradient id="yellowBase" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffe14c"/>
      <stop offset="35%" stop-color="#fb9f03"/>
      <stop offset="85%" stop-color="#ca6e00"/>
      <stop offset="100%" stop-color="#914d00"/>
    </linearGradient>
    
    <!-- Glass/Glossy Overlay Gradients -->
    <linearGradient id="glassGloss" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.55"/>
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.15"/>
      <stop offset="50.1%" stop-color="#ffffff" stop-opacity="0.0"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.0"/>
    </linearGradient>
  </defs>
  
  <g filter="url(#logoShadow)">
    <!-- RED PANEL -->
    <g>
      <!-- Base Color -->
      <path d="M15 25 Q 32 18, 50 25 L 50 48 Q 32 41, 15 48 Z" fill="url(#redBase)"/>
      <!-- Inner Bevel/Edge Highlights (Top/Left) -->
      <path d="M15 25 Q 32 18, 50 25 L 50 26 Q 32 19, 15 26 Z" fill="#ffffff" fill-opacity="0.4"/>
      <path d="M15 25 L 16 26 L 16 47 L 15 48 Z" fill="#ffffff" fill-opacity="0.4"/>
      <!-- Glossy Reflection Overlay -->
      <path d="M15 25 Q 32 18, 50 25 L 50 48 Q 32 41, 15 48 Z" fill="url(#glassGloss)" pointer-events="none"/>
    </g>
    
    <!-- GREEN PANEL -->
    <g>
      <!-- Base Color -->
      <path d="M54 25 Q 72 32, 90 25 L 90 48 Q 72 55, 54 48 Z" fill="url(#greenBase)"/>
      <!-- Inner Bevel/Edge Highlights (Top/Left) -->
      <path d="M54 25 Q 72 32, 90 25 L 90 26 Q 72 33, 54 26 Z" fill="#ffffff" fill-opacity="0.4"/>
      <path d="M54 25 L 55 26 L 55 47 L 54 48 Z" fill="#ffffff" fill-opacity="0.4"/>
      <!-- Glossy Reflection Overlay -->
      <path d="M54 25 Q 72 32, 90 25 L 90 48 Q 72 55, 54 48 Z" fill="url(#glassGloss)" pointer-events="none"/>
    </g>
    
    <!-- BLUE PANEL -->
    <g>
      <!-- Base Color -->
      <path d="M15 52 Q 32 45, 50 52 L 50 75 Q 32 68, 15 75 Z" fill="url(#blueBase)"/>
      <!-- Inner Bevel/Edge Highlights (Top/Left) -->
      <path d="M15 52 Q 32 45, 50 52 L 50 53 Q 32 46, 15 53 Z" fill="#ffffff" fill-opacity="0.4"/>
      <path d="M15 52 L 16 53 L 16 74 L 15 75 Z" fill="#ffffff" fill-opacity="0.4"/>
      <!-- Glossy Reflection Overlay -->
      <path d="M15 52 Q 32 45, 50 52 L 50 75 Q 32 68, 15 75 Z" fill="url(#glassGloss)" pointer-events="none"/>
    </g>
    
    <!-- YELLOW PANEL -->
    <g>
      <!-- Base Color -->
      <path d="M54 52 Q 72 59, 90 52 L 90 75 Q 72 82, 54 75 Z" fill="url(#yellowBase)"/>
      <!-- Inner Bevel/Edge Highlights (Top/Left) -->
      <path d="M54 52 Q 72 59, 90 52 L 90 53 Q 72 60, 54 53 Z" fill="#ffffff" fill-opacity="0.4"/>
      <path d="M54 52 L 55 53 L 55 74 L 54 75 Z" fill="#ffffff" fill-opacity="0.4"/>
      <!-- Glossy Reflection Overlay -->
      <path d="M54 52 Q 72 59, 90 52 L 90 75 Q 72 82, 54 75 Z" fill="url(#glassGloss)" pointer-events="none"/>
    </g>
  </g>
</svg>