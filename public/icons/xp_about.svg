<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48">
  <defs>
    <radialGradient id="bg_about" cx="50%" cy="35%" r="60%">
      <stop offset="0%" stop-color="#5cb8ff"/>
      <stop offset="100%" stop-color="#1a6fc4"/>
    </radialGradient>
    <radialGradient id="face" cx="50%" cy="40%" r="55%">
      <stop offset="0%" stop-color="#ffe8cc"/>
      <stop offset="100%" stop-color="#f4b87a"/>
    </radialGradient>
    <filter id="shadow_about" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="1" dy="2" stdDeviation="1.5" flood-color="rgba(0,0,0,0.4)"/>
    </filter>
  </defs>
  <!-- Monitor base -->
  <rect x="4" y="4" width="40" height="40" rx="4" ry="4" fill="url(#bg_about)" filter="url(#shadow_about)"/>
  <!-- White inner screen area -->
  <rect x="8" y="8" width="32" height="24" rx="2" fill="#e8f4ff" opacity="0.9"/>
  <!-- User silhouette - head -->
  <circle cx="24" cy="17" r="5" fill="url(#face)"/>
  <!-- User silhouette - body -->
  <path d="M14 32 Q14 24 24 24 Q34 24 34 32 Z" fill="url(#face)"/>
  <!-- Info card strip at bottom -->
  <rect x="4" y="38" width="40" height="6" rx="0" ry="0" fill="#0a5fd4" opacity="0.7"/>
  <rect x="4" y="38" width="40" height="2" fill="#3a8fff" opacity="0.6"/>
  <!-- Shine -->
  <rect x="8" y="8" width="32" height="4" rx="2" fill="white" opacity="0.25"/>
</svg>
