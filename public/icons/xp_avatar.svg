<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48">
  <defs>
    <radialGradient id="avatar_face" cx="50%" cy="38%" r="60%">
      <stop offset="0%" stop-color="#ffe5c0"/>
      <stop offset="100%" stop-color="#f0a060"/>
    </radialGradient>
    <linearGradient id="avatar_shirt" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#5090e0"/>
      <stop offset="100%" stop-color="#2060c0"/>
    </linearGradient>
    <radialGradient id="avatar_bg" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#c8deff"/>
      <stop offset="100%" stop-color="#7aaee8"/>
    </radialGradient>
    <filter id="shadow_avatar">
      <feDropShadow dx="1" dy="2" stdDeviation="1.5" flood-color="rgba(0,0,0,0.3)"/>
    </filter>
  </defs>
  <!-- Background -->
  <rect x="2" y="2" width="44" height="44" rx="4" fill="url(#avatar_bg)" filter="url(#shadow_avatar)"/>
  <!-- Shine top -->
  <rect x="2" y="2" width="44" height="10" rx="4" fill="white" opacity="0.2"/>
  <!-- Head -->
  <circle cx="24" cy="17" r="8" fill="url(#avatar_face)"/>
  <!-- Neck -->
  <rect x="21" y="24" width="6" height="4" fill="url(#avatar_face)"/>
  <!-- Shirt / body -->
  <path d="M10 46 Q10 34 18 32 L24 35 L30 32 Q38 34 38 46 Z" fill="url(#avatar_shirt)"/>
  <!-- Collar -->
  <path d="M18 32 L24 36 L30 32" fill="none" stroke="white" stroke-width="1.2" stroke-linecap="round"/>
  <!-- Eyes -->
  <circle cx="21" cy="16" r="1.2" fill="#4a3020"/>
  <circle cx="27" cy="16" r="1.2" fill="#4a3020"/>
  <!-- Smile -->
  <path d="M20.5 21 Q24 24 27.5 21" fill="none" stroke="#c07040" stroke-width="1" stroke-linecap="round"/>
</svg>
