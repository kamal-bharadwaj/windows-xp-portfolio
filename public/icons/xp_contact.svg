<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48">
  <defs>
    <radialGradient id="env_bg" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#dce8ff"/>
    </radialGradient>
    <linearGradient id="env_flap" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#4a90e2"/>
      <stop offset="100%" stop-color="#1a5cbf"/>
    </linearGradient>
    <filter id="shadow_env">
      <feDropShadow dx="1" dy="2" stdDeviation="1.5" flood-color="rgba(0,0,0,0.4)"/>
    </filter>
  </defs>
  <!-- Envelope body -->
  <rect x="4" y="12" width="40" height="28" rx="3" fill="url(#env_bg)" filter="url(#shadow_env)"/>
  <!-- Envelope bottom fold lines -->
  <line x1="4" y1="40" x2="24" y2="27" stroke="#b0c4e8" stroke-width="1"/>
  <line x1="44" y1="40" x2="24" y2="27" stroke="#b0c4e8" stroke-width="1"/>
  <!-- Envelope top flap (open) -->
  <path d="M4 12 L24 26 L44 12 Z" fill="url(#env_flap)" opacity="0.9"/>
  <!-- Envelope fold V-line -->
  <line x1="4" y1="12" x2="24" y2="26" stroke="#2060c0" stroke-width="0.8"/>
  <line x1="44" y1="12" x2="24" y2="26" stroke="#2060c0" stroke-width="0.8"/>
  <!-- Letter peeking out -->
  <rect x="15" y="5" width="18" height="14" rx="2" fill="white" stroke="#c8d8f0" stroke-width="0.5"/>
  <rect x="18" y="9" width="12" height="1.5" rx="0.8" fill="#aac0e0"/>
  <rect x="18" y="12" width="9" height="1.5" rx="0.8" fill="#aac0e0"/>
  <!-- Stamp -->
  <rect x="27" y="6" width="5" height="5" rx="1" fill="#ff4444" opacity="0.8"/>
</svg>
