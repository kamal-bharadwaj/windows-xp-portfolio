<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48">
  <defs>
    <linearGradient id="admin_bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a0c0ff"/>
      <stop offset="100%" stop-color="#5080d0"/>
    </linearGradient>
    <linearGradient id="admin_screen" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1a2040"/>
      <stop offset="100%" stop-color="#0d1020"/>
    </linearGradient>
    <filter id="shadow_admin">
      <feDropShadow dx="1" dy="2" stdDeviation="1.5" flood-color="rgba(0,0,0,0.4)"/>
    </filter>
  </defs>
  <!-- Outer body (clipboard) -->
  <rect x="8" y="6" width="32" height="38" rx="3" fill="url(#admin_bg)" filter="url(#shadow_admin)"/>
  <!-- Clip at top -->
  <rect x="18" y="3" width="12" height="6" rx="2" fill="#6080b8"/>
  <!-- Screen area / dark panel -->
  <rect x="11" y="12" width="26" height="22" rx="1" fill="url(#admin_screen)"/>
  <!-- Code lines (green text) -->
  <rect x="13" y="15" width="10" height="1.5" rx="0.8" fill="#00e080" opacity="0.9"/>
  <rect x="13" y="19" width="16" height="1.5" rx="0.8" fill="#00e080" opacity="0.7"/>
  <rect x="13" y="23" width="12" height="1.5" rx="0.8" fill="#00e080" opacity="0.8"/>
  <rect x="13" y="27" width="18" height="1.5" rx="0.8" fill="#00e080" opacity="0.6"/>
  <!-- Cursor blink -->
  <rect x="25" y="27" width="4" height="1.5" rx="0.8" fill="#00e080" opacity="0.4"/>
  <!-- Shield badge (admin) -->
  <path d="M32 31 L32 38 Q32 42 36 42 Q40 42 40 38 L40 31 Q36 29 32 31 Z" fill="#ffd700"/>
  <path d="M34 35 L35.5 37 L38.5 33" fill="none" stroke="#8a6000" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Bottom clip lines -->
  <rect x="12" y="37" width="16" height="1.5" rx="0.8" fill="#7090c0" opacity="0.6"/>
  <rect x="12" y="40" width="10" height="1.5" rx="0.8" fill="#7090c0" opacity="0.5"/>
</svg>
