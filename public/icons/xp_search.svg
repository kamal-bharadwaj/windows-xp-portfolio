<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48">
  <defs>
    <radialGradient id="glass_outer" cx="40%" cy="35%" r="55%">
      <stop offset="0%" stop-color="#a8d8ff"/>
      <stop offset="100%" stop-color="#4090e0"/>
    </radialGradient>
    <radialGradient id="glass_inner" cx="38%" cy="32%" r="50%">
      <stop offset="0%" stop-color="rgba(255,255,255,0.7)"/>
      <stop offset="100%" stop-color="rgba(200,230,255,0.1)"/>
    </radialGradient>
    <filter id="shadow_search">
      <feDropShadow dx="1" dy="2" stdDeviation="1.5" flood-color="rgba(0,0,80,0.4)"/>
    </filter>
  </defs>
  <!-- Magnifying glass circle - outer ring -->
  <circle cx="20" cy="20" r="14" fill="none" stroke="#1a6abf" stroke-width="4" filter="url(#shadow_search)"/>
  <!-- Glass tint -->
  <circle cx="20" cy="20" r="12" fill="url(#glass_outer)" opacity="0.85"/>
  <!-- Glass shine -->
  <circle cx="20" cy="20" r="12" fill="url(#glass_inner)"/>
  <!-- Handle -->
  <line x1="30" y1="30" x2="42" y2="43" stroke="#1a50a0" stroke-width="5" stroke-linecap="round" filter="url(#shadow_search)"/>
  <line x1="30" y1="30" x2="42" y2="43" stroke="#4090d0" stroke-width="3" stroke-linecap="round"/>
  <!-- Inner shimmer highlights -->
  <circle cx="15" cy="14" r="3" fill="white" opacity="0.45"/>
</svg>
