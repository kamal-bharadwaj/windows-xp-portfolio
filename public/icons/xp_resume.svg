      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#dde8f8"/>
    </linearGradient>
    <linearGradient id="doc_fold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#bfd0e8"/>
