<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48">
  <defs>
    <linearGradient id="folder_body" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffe066"/>
      <stop offset="50%" stop-color="#ffb800"/>
      <stop offset="100%" stop-color="#e08000"/>
    </linearGradient>
    <linearGradient id="folder_top" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffd040"/>
      <stop offset="100%" stop-color="#e09000"/>
    </linearGradient>
    <filter id="shadow_folder">
      <feDropShadow dx="1" dy="2" stdDeviation="1.5" flood-color="rgba(0,0,0,0.4)"/>
    </filter>
  </defs>
  <!-- Shadow -->
  <ellipse cx="24" cy="46" rx="18" ry="2" fill="rgba(0,0,0,0.18)"/>
  <!-- Folder tab -->
  <path d="M6 16 L6 14 Q6 12 8 12 L20 12 Q22 12 22 14 L22 16 Z" fill="url(#folder_top)"/>
  <!-- Folder body -->
  <rect x="4" y="16" width="40" height="26" rx="3" ry="3" fill="url(#folder_body)" filter="url(#shadow_folder)"/>
  <!-- Inner shine line -->
  <rect x="4" y="16" width="40" height="3" rx="2" fill="white" opacity="0.3"/>
  <!-- Document lines inside folder -->
  <rect x="11" y="24" width="18" height="2" rx="1" fill="rgba(160,80,0,0.35)"/>
  <rect x="11" y="29" width="14" height="2" rx="1" fill="rgba(160,80,0,0.28)"/>
  <rect x="11" y="34" width="16" height="2" rx="1" fill="rgba(160,80,0,0.22)"/>
  <!-- Star badge for "projects" -->
  <polygon points="38,20 39.5,25 44,25 40.5,28 42,33 38,30 34,33 35.5,28 32,25 36.5,25" fill="#fff" opacity="0.85"/>
</svg>
